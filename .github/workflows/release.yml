name: Release
# Changesets: on main, open / update the "chore: version packages" PR while
# changesets are pending; once that PR is merged (no pending changesets),
# publish every @echozedlabs/techtree-* package whose version is not on npm yet.
#
# Auth: npm trusted publishing (OIDC). No NPM_TOKEN secret. Each package on
# npmjs.com has a trusted publisher: GitHub Actions, echozulucode/techtree,
# workflow release.yml. Needs id-token: write and npm >= 11.5.1. Provenance is
# added automatically when the repository is public.
# Packages that are not on npm yet need one manual first publish (README).
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publish outside changesets/action: it would write an .npmrc auth-token
      # line (empty without NPM_TOKEN) that stops npm from using OIDC.
      - name: Publish to npm (trusted publishing)
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          npm install -g npm@11
          npm --version
          node scripts/publish-packages.mjs
          git push origin --tags
