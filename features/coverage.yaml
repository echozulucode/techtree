    - scenario: 'No satisfied alternative keeps a node locked'
      status: covered
      unit: ['state/src/status-model.test.ts::treats unset nodes as not_started and derives available / locked for display']
    - scenario: 'An unknown alternative is rejected when the tree is compiled'
      status: covered
