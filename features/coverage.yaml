      e2e: ['embed::renders lanes, era headers and every capability']
      bdd: true
    - scenario: 'Highlighting what a capability needs'
      status: covered
      unit: ['viewer/src/viewer.test.tsx::ancestors = what a node needs, descendants = what it unlocks']
      bdd: true
    - scenario: 'Highlighting what a capability unlocks'
      status: covered
      unit:
        - 'viewer/src/viewer.test.tsx::ancestors = what a node needs, descendants = what it unlocks'
        - 'react19-host/src/dom.test.tsx::"what does X unlock" highlights downstream nodes and dims the rest'
      bdd: true
    - scenario: 'Filtering by maturity keeps eras and branches in place'
      status: covered
      unit: ['react19-host/src/dom.test.tsx::a status filter hides other nodes and reports the change']
      bdd: true
    - scenario: 'An outline lists every capability for keyboard and screen-reader users'
      status: covered
      unit:
        - 'viewer/src/viewer.test.tsx::outline view lists nodes under their branch and era with prerequisite links'
        - 'react19-host/src/dom.test.tsx::switches to the outline view'
      bdd: true
    - scenario: 'The capability card shows maturity, prerequisites and eureka goals'
      status: covered
      unit: ['react19-host/src/dom.test.tsx::clicking a node calls onSelectNode and opens the drawer']
      bdd: true
    - scenario: 'Links the host withholds are neither shown nor counted'
      status: covered
      unit: ['viewer/src/viewer.test.tsx::drawer resolves links through renderLink and omits (and does not count) withheld ones']
      bdd: true

  embedding:
    - scenario: "The view follows the host's light or dark scheme"
      status: covered
      bdd: true
    - scenario: 'The view server-renders and runs under React 19'
      status: covered
      unit:
        - 'react19-host/src/ssr.test.tsx::renders the tree, statuses, and a selected node drawer to HTML'
        - 'react19-host/src/dom.test.tsx::clicking a node calls onSelectNode and opens the drawer'
    - scenario: 'The view never touches the browser while being imported'
      status: covered
      unit:
